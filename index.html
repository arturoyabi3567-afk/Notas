<style>
:root{--bg:#f5f6f4;--surf:#fff;--ink:#1c2430;--mut:#6b7480;--line:#e2e5e1;--acc:#2f4a6b;--gold:#a88a54;
--c1:#cfe2f4;--c2:#f2d3d3;--c3:#d5e9d6;--c4:#eee2bf;
--serif:'Newsreader',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--surf:#1a2029;--ink:#e8eaed;--mut:#8f98a3;--line:#2a313b;--acc:#8fb0d8;--gold:#c9ab74;
--c1:#28405a;--c2:#593030;--c3:#2b4a2e;--c4:#53482a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px}
.top{padding:calc(env(safe-area-inset-top) + 18px) 22px 6px}
h1{font:500 34px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
main{padding:8px 20px calc(96px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
.top{max-width:680px;margin:0 auto}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.filtros{display:flex;gap:8px;margin:10px 0 18px}
.nota{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;cursor:pointer}
.nota h3{font:500 21px/1.25 var(--serif);margin:0 0 4px}
.meta{margin:0;color:var(--mut);font-size:14px}
.fr{margin:10px 0 0;font:italic 17px/1.45 var(--serif);color:var(--acc)}
.vacio{color:var(--mut);text-align:center;margin:60px 20px;line-height:1.5}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:10px 20px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{flex:1;max-width:160px;background:none;border:0;padding:10px;border-radius:10px;color:var(--mut)}
nav button.on{color:var(--ink);font-weight:500;box-shadow:inset 0 -2px 0 var(--gold)}
#nuevo{position:fixed;right:22px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--bg);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0 16px;padding-bottom:4px}
.chips button,.btn,.sec{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap;cursor:pointer}
.chips button.on{border-color:var(--acc);color:var(--acc)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}
blockquote{margin:0 0 12px;padding:14px 16px;border-radius:12px;font:18px/1.5 var(--serif);cursor:pointer}
cite{display:block;margin-top:8px;font:13px var(--sans);color:var(--mut);font-style:normal}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 22px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font:500 32px/1 var(--serif);margin-bottom:6px}
.stat span{color:var(--mut);font-size:14px}
h2{font:500 22px var(--serif);margin:26px 0 10px}
.resp{white-space:pre-wrap;line-height:1.55;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
#editor{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:10}
.eh{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 20px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.eh button{background:none;border:0;color:var(--acc);padding:6px 0}
.eh .del{color:#b04a4a}
#estado{color:var(--mut);font-size:13px}
.ec{max-width:680px;margin:0 auto;padding:18px 20px calc(60px + env(safe-area-inset-bottom))}
.ec label.l{display:block;color:var(--mut);font-size:14px;margin:22px 0 8px}
.tit{font:500 28px/1.2 var(--serif);border:0;background:none;padding:6px 0;margin-bottom:6px}
.fila{display:flex;gap:8px;margin-bottom:8px}
#texto{min-height:44vh;font:19px/1.65 var(--serif);resize:vertical;margin-top:10px}
.vers{font:italic 17px/1.55 var(--serif);color:var(--mut);margin:6px 0}
.marca{display:flex;gap:8px;align-items:center;margin:10px 0;overflow-x:auto}
.marca span{color:var(--mut);font-size:14px;white-space:nowrap}
.mk{border:0;border-radius:999px;padding:8px 14px;color:var(--ink)}
.fch{display:flex;flex-direction:column;gap:8px}
.fch div{display:flex;justify-content:space-between;gap:10px;border-radius:10px;padding:10px 12px;font:16px/1.4 var(--serif)}
.fch button{background:none;border:0;color:var(--mut)}
#fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
#fotos div{position:relative}
#fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
#fotos button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.55);color:#fff}
.pri{background:var(--acc);color:var(--bg);border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90%;text-align:center}
@media(prefers-reduced-motion:no-preference){.nota:active,blockquote:active{transform:scale(.99);transition:transform .1s}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

</style>
</head>
<body>
<header class="top"><h1 id="titulo">Notas</h1></header>
<main id="vista"></main>
<button id="nuevo" aria-label="Nueva nota">+</button>
<nav>
  <button data-t="notas">Notas</button>
  <button data-t="frases">Frases</button>
  <button data-t="resumen">Resumen</button>
</nav>
<section id="editor" hidden></section>
<div id="toast" hidden></div>
<script>
// Pega aquí la URL de tu Apps Script publicado como "Aplicación web".
// Si la dejas vacía, la app funciona igual pero solo guarda en este teléfono.
const CONFIG = {
  URL_SCRIPT: 'https://script.google.com/macros/s/AKfycbwdW_I-grKHHU_1FfL8fOq-hUd1EuAdjYTOGI2wuteD6klH-jeyJH6WYBPUaVkpbJI/exec'
};

// Guardado local + cola de sincronización con Google Sheets (vía Apps Script)
const Store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  all() { return this.get('np_notas', {}); },
  put(n) { const a = this.all(); a[n.id] = n; localStorage.setItem('np_notas', JSON.stringify(a)); this.enqueue(n.id); },
  del(id) { const a = this.all(); delete a[id]; localStorage.setItem('np_notas', JSON.stringify(a)); this.enqueue(id); },
  cola() { return this.get('np_cola', []); },
  enqueue(id) { const c = this.cola(); if (!c.includes(id)) c.push(id); localStorage.setItem('np_cola', JSON.stringify(c)); },
  dequeue(id) { localStorage.setItem('np_cola', JSON.stringify(this.cola().filter(x => x !== id))); }
};

const Sync = {
  activo: () => !!CONFIG.URL_SCRIPT,
  async api(body) {
    if (!CONFIG.URL_SCRIPT) throw new Error('Falta la URL del Apps Script en js/config.js');
    const r = await fetch(CONFIG.URL_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return j;
  },
  async flush() {
    if (!this.activo() || !navigator.onLine) return;
    for (const id of Store.cola()) {
      const n = Store.all()[id];
      try {
        await this.api(n ? { accion: 'guardar', nota: n } : { accion: 'borrar', id });
        Store.dequeue(id);
      } catch (e) { return; }
    }
  },
  async pull() {
    if (!this.activo() || !navigator.onLine) return false;
    await this.flush();
    const { notas } = await this.api({ accion: 'listar' });
    const local = Store.all(), pend = Store.cola(), remoto = {};
    notas.forEach(n => { remoto[n.id] = n; });
    Object.keys(local).forEach(id => { if (!pend.includes(id) && !remoto[id]) delete local[id]; });
    notas.forEach(n => { if (!pend.includes(n.id) && (!local[n.id] || (n.actualizado || 0) >= (local[n.id].actualizado || 0))) local[n.id] = n; });
    localStorage.setItem('np_notas', JSON.stringify(local));
    return true;
  }
};

// Trae el texto de un pasaje (Reina-Valera 1909) para no escribirlo a mano.
async function traerVersiculo(ref) {
  const u = 'https://bss-api.thechurchofgod.info/api?bible=rv_1909&reference=' + encodeURIComponent(ref);
  const j = await (await fetch(u)).json();
  const out = [];
  (function walk(o) {
    if (!o || typeof o !== 'object') return;
    if (typeof o.text === 'string' && o.verse !== undefined) out.push(o.verse + ' ' + o.text.replace(/<[^>]+>/g, '').trim());
    else Object.values(o).forEach(walk);
  })(j);
  if (!out.length) throw new Error('No encontré ese pasaje. Prueba otro formato, por ejemplo "Jn 3:16".');
  return out.join(' ');
}

// IA: arma el texto para pedir un resumen, lo copia o lo manda a Gemini (vía Apps Script).
const IA = {
  promptNota(n) {
    const fr = (n.frases || []).map(f => '- ' + f.t).join('\n');
    return `Estas son mis notas de una predicación. Hazme: 1) un resumen breve, 2) los puntos principales en lista, 3) una frase corta para llevarme en la semana, 4) una aplicación práctica para esta semana. Responde en español, con tono sencillo.\n\nTítulo: ${n.titulo}\nPredicador: ${n.predicador}\nPasaje: ${n.pasaje}\n\nNotas:\n${n.texto}\n\nFrases que marqué:\n${fr || '(ninguna)'}`;
  },
  promptPregunta(q, notas) {
    const t = notas.sort((a, b) => b.fecha.localeCompare(a.fecha)).map(n => `[${n.fecha}] ${n.titulo} (${n.pasaje})\n${n.texto}\n${(n.frases || []).map(f => '* ' + f.t).join('\n')}`).join('\n\n---\n\n').slice(0, 30000);
    return `Responde en español usando solo mis notas de predicaciones. Si no hay información, dilo.\n\nPregunta: ${q}\n\nMis notas:\n${t}`;
  },
  async procesar(prompt) { return (await Sync.api({ accion: 'ia', prompt })).texto; },
  async copiar(texto) { await navigator.clipboard.writeText(texto); }
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COL = [{ k: 1, n: 'Promesa' }, { k: 2, n: 'Mandato' }, { k: 3, n: 'Aplicar' }, { k: 4, n: 'Otra' }];
const hoy = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const fmt = f => new Date(f + 'T12:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
const libro = p => ((p || '').match(/^(?:\d\s*)?[^\d:]+/) || [''])[0].trim();
const semana = f => Math.floor((Date.parse(f) / 864e5 + 3) / 7);
let tab = 'notas', F = { q: '', pred: '', lib: '' }, FC = 0, cur = null, tmr;

function toast(t) { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(e._t); e._t = setTimeout(() => e.hidden = true, 2600); }

function vista() {
  $('#titulo').textContent = { notas: 'Notas', frases: 'Frases', resumen: 'Resumen' }[tab];
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  ({ notas: vNotas, frases: vFrases, resumen: vResumen })[tab]();
}

/* ---------- Notas: lista, búsqueda y filtros ---------- */
function vNotas() {
  const a = Object.values(Store.all());
  const preds = [...new Set(a.map(n => n.predicador).filter(Boolean))].sort();
  const libs = [...new Set(a.map(n => libro(n.pasaje)).filter(Boolean))].sort();
  const op = (l, v) => l.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
  $('#vista').innerHTML = `<input id="q" type="search" placeholder="Buscar en tus notas" value="${esc(F.q)}">
  <div class="filtros"><select id="fp"><option value="">Predicador</option>${op(preds, F.pred)}</select>
  <select id="fl"><option value="">Libro</option>${op(libs, F.lib)}</select></div><div id="lista"></div>`;
  $('#q').oninput = e => { F.q = e.target.value; lista(); };
  $('#fp').onchange = e => { F.pred = e.target.value; lista(); };
  $('#fl').onchange = e => { F.lib = e.target.value; lista(); };
  lista();
}
function lista() {
  const q = F.q.toLowerCase(), todas = Object.values(Store.all());
  const a = todas.filter(n => (!F.pred || n.predicador === F.pred) && (!F.lib || libro(n.pasaje) === F.lib) &&
    (!q || [n.titulo, n.predicador, n.pasaje, n.texto, n.frase, n.resumen, ...(n.frases || []).map(f => f.t)].join(' ').toLowerCase().includes(q)))
    .sort((x, y) => y.fecha.localeCompare(x.fecha));
  $('#lista').innerHTML = a.length ? a.map(n => `<article class="nota" data-id="${n.id}"><h3>${esc(n.titulo || 'Sin título')}</h3>
    <p class="meta">${esc([fmt(n.fecha), n.predicador, n.pasaje].filter(Boolean).join(', '))}</p>${n.frase ? `<p class="fr">${esc(n.frase)}</p>` : ''}</article>`).join('')
    : `<p class="vacio">${todas.length ? 'Nada coincide con tu búsqueda.' : 'Aún no hay notas. Toca + para escribir la primera.'}</p>`;
  document.querySelectorAll('.nota').forEach(e => e.onclick = () => abrir(e.dataset.id));
}

/* ---------- Frases marcadas ---------- */
function vFrases() {
  const items = [];
  Object.values(Store.all()).forEach(n => (n.frases || []).forEach(f => items.push({ ...f, n })));
  const sh = items.filter(i => !FC || i.c === FC).sort((x, y) => y.n.fecha.localeCompare(x.n.fecha));
  $('#vista').innerHTML = `<div class="chips"><button data-c="0" class="${!FC ? 'on' : ''}">Todas</button>${COL.map(c => `<button data-c="${c.k}" class="${FC === c.k ? 'on' : ''}"><i class="dot c${c.k}"></i>${c.n}</button>`).join('')}</div>` +
    (sh.length ? sh.map(i => `<blockquote class="c${i.c}" data-id="${i.n.id}">${esc(i.t)}<cite>${esc(i.n.titulo || 'Sin título')}, ${esc(fmt(i.n.fecha))}</cite></blockquote>`).join('')
      : '<p class="vacio">Aquí aparecerán las frases que marques mientras escribes una nota.</p>');
  document.querySelectorAll('.chips button').forEach(b => b.onclick = () => { FC = +b.dataset.c; vFrases(); });
  document.querySelectorAll('blockquote').forEach(b => b.onclick = () => abrir(b.dataset.id));
}

/* ---------- Resumen: estadísticas, repaso y preguntas a la IA ---------- */
function vResumen() {
  const a = Object.values(Store.all()), semanas = new Set(a.map(n => semana(n.fecha)));
  let s = semana(hoy()), racha = 0;
  if (!semanas.has(s)) s--;
  while (semanas.has(s)) { racha++; s--; }
  const cuenta = {}; a.forEach(n => { const l = libro(n.pasaje); if (l) cuenta[l] = (cuenta[l] || 0) + 1; });
  const top = Object.entries(cuenta).sort((x, y) => y[1] - x[1])[0];
  const marcadas = a.reduce((t, n) => t + (n.frases || []).length, 0);
  const ult = [...a].sort((x, y) => y.fecha.localeCompare(x.fecha))[0];
  $('#vista').innerHTML = `<div class="stats">
    <div class="stat"><b>${a.length}</b><span>notas</span></div>
    <div class="stat"><b>${racha}</b><span>semanas seguidas</span></div>
    <div class="stat"><b>${marcadas}</b><span>frases marcadas</span></div>
    <div class="stat"><b>${top ? esc(top[0]) : '–'}</b><span>libro más anotado</span></div></div>
  ${ult ? `<h2>Para repasar</h2><div class="nota" id="rep"><h3>${esc(ult.titulo || 'Sin título')}</h3><p class="meta">${esc(fmt(ult.fecha))}</p>
    <p class="fr">${esc(ult.frase || ult.resumen || '')}</p></div>` : ''}
  <h2>Pregunta a tus notas</h2>
  <input id="preg" placeholder="Ej. ¿Qué he anotado sobre la oración?">
  <div class="fila" style="margin-top:10px"><button class="pri" id="pq">Preguntar</button><button class="sec" id="cq">Copiar para IA</button></div>
  <div id="resp"></div>`;
  if (ult) $('#rep').onclick = () => abrir(ult.id);
  const pr = () => IA.promptPregunta($('#preg').value.trim() || 'Resume los temas principales', Object.values(Store.all()));
  $('#cq').onclick = () => IA.copiar(pr()).then(() => toast('Copiado. Pégalo en tu IA'));
  $('#pq').onclick = async () => {
    $('#resp').innerHTML = '<div class="resp">Pensando…</div>';
    try { $('#resp').innerHTML = `<div class="resp">${esc(await IA.procesar(pr()))}</div>`; }
    catch (e) { $('#resp').innerHTML = `<div class="resp">${esc(e.message)}</div>`; }
  };
}

/* ---------- Editor de nota ---------- */
function estado() { const e = $('#estado'); if (e) e.textContent = !Sync.activo() ? 'Guardado en este teléfono' : Store.cola().length ? 'Pendiente de sincronizar' : 'Guardado'; }
function guardar() {
  cur.actualizado = Date.now(); Store.put(cur); estado();
  clearTimeout(tmr); tmr = setTimeout(() => Sync.flush().then(estado), 900);
}
function abrir(id) {
  cur = id ? structuredClone(Store.all()[id]) : { id: 'n' + Date.now().toString(36), fecha: hoy(), titulo: '', predicador: '', pasaje: '', versiculo: '', texto: '', frase: '', frases: [], fotos: [], resumen: '', actualizado: 0 };
  const ed = $('#editor');
  ed.innerHTML = `<div class="eh"><button id="cerrar">Listo</button><span id="estado"></span><button class="del" id="borrar">Eliminar</button></div>
  <div class="ec">
    <input class="tit" data-f="titulo" placeholder="Título del mensaje">
    <div class="fila"><input data-f="predicador" placeholder="Predicador"><input data-f="fecha" type="date"></div>
    <div class="fila"><input data-f="pasaje" placeholder="Pasaje, ej. Juan 3:16-18"><button class="sec" id="verso">Traer texto</button></div>
    <p class="vers" id="vers"></p>
    <textarea id="texto" data-f="texto" placeholder="Escribe tus notas…"></textarea>
    <div class="marca"><span>Marcar frase</span>${COL.map(c => `<button class="mk c${c.k}" data-k="${c.k}">${c.n}</button>`).join('')}</div>
    <div class="fch" id="fch"></div>
    <label class="l">Frase para la semana</label><input data-f="frase">
    <label class="l">Fotos</label><div id="fotos"></div>
    <label class="sec" style="display:inline-block">Agregar foto<input id="foto" type="file" accept="image/*" hidden></label>
    <label class="l">Resumen con IA</label><textarea data-f="resumen" id="resumen" rows="5"></textarea>
    <div class="fila" style="margin-top:10px"><button class="pri" id="ia">Resumir con IA</button><button class="sec" id="cp">Copiar para IA</button></div>
  </div>`;
  ed.hidden = false; document.body.style.overflow = 'hidden';
  ed.querySelectorAll('[data-f]').forEach(i => i.value = cur[i.dataset.f] || '');
  $('#vers').textContent = cur.versiculo || '';
  pintaFrases(); pintaFotos(); estado();
  ed.oninput = e => { const f = e.target.dataset.f; if (f) { cur[f] = e.target.value; guardar(); } };
  $('#cerrar').onclick = cerrar;
  $('#borrar').onclick = () => { if (confirm('¿Eliminar esta nota?')) { Store.del(cur.id); Sync.flush(); cerrar(); } };
  $('#verso').onclick = async () => {
    if (!cur.pasaje.trim()) return toast('Escribe primero el pasaje');
    try { cur.versiculo = await traerVersiculo(cur.pasaje.trim()); $('#vers').textContent = cur.versiculo; guardar(); }
    catch (e) { toast(e.message); }
  };
  ed.querySelectorAll('.mk').forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => {
    const t = $('#texto'), s = t.selectionStart, f = t.selectionEnd;
    if (f - s < 2) return toast('Selecciona una frase en tus notas');
    cur.frases.push({ t: t.value.slice(s, f).trim(), c: +b.dataset.k }); guardar(); pintaFrases();
  }; });
  $('#foto').onchange = subirFoto;
  $('#cp').onclick = () => IA.copiar(IA.promptNota(cur)).then(() => toast('Copiado. Pégalo en tu IA'));
  $('#ia').onclick = async () => {
    toast('Procesando…');
    try { cur.resumen = await IA.procesar(IA.promptNota(cur)); $('#resumen').value = cur.resumen; guardar(); toast('Resumen guardado'); }
    catch (e) { toast(e.message); }
  };
}
function cerrar() { clearTimeout(tmr); Sync.flush(); $('#editor').hidden = true; document.body.style.overflow = ''; cur = null; vista(); }
function pintaFrases() {
  $('#fch').innerHTML = cur.frases.map((f, i) => `<div class="c${f.c}"><span>${esc(f.t)}</span><button data-i="${i}" aria-label="Quitar">×</button></div>`).join('');
  $('#fch').querySelectorAll('button').forEach(b => b.onclick = () => { cur.frases.splice(+b.dataset.i, 1); guardar(); pintaFrases(); });
}
function pintaFotos() {
  $('#fotos').innerHTML = cur.fotos.map((u, i) => `<div><a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" loading="lazy" alt="Foto"></a><button data-i="${i}" aria-label="Quitar">×</button></div>`).join('');
  $('#fotos').querySelectorAll('button').forEach(b => b.onclick = () => { cur.fotos.splice(+b.dataset.i, 1); guardar(); pintaFotos(); });
}
async function comprimir(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => createImageBitmap(file));
  const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .72).split(',')[1];
}
async function subirFoto(e) {
  const file = e.target.files[0]; if (!file) return;
  if (!Sync.activo()) return toast('Para guardar fotos conecta el Apps Script');
  if (!navigator.onLine) return toast('Necesitas internet para subir la foto');
  toast('Subiendo foto…');
  try {
    const { url } = await Sync.api({ accion: 'foto', nombre: `${cur.fecha}-${Date.now()}.jpg`, data: await comprimir(file) });
    cur.fotos.push(url); guardar(); pintaFotos(); toast('Foto guardada');
  } catch (err) { toast(err.message); }
  e.target.value = '';
}

/* ---------- Inicio ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; vista(); });
$('#nuevo').onclick = () => abrir();
addEventListener('online', () => Sync.flush());
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
vista();
Sync.pull().then(ok => { if (ok && !cur) vista(); }).catch(() => {});

</script>
